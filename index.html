<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匿名掲示板 · 中文2ch生成器</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#253129;background:#f1f4f0}*{box-sizing:border-box}body{margin:0}.top{background:#263d31;color:white;padding:15px 20px}.top h1{font-size:19px;margin:0}.top small{opacity:.75}.layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(320px,1fr);gap:18px;padding:18px;max-width:1400px;margin:auto}.panel{background:white;border:1px solid #d7dfd8;border-radius:12px;padding:16px;box-shadow:0 2px 10px #152b1710}.panel h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5ce;border-radius:7px;background:white;font:inherit;font-size:14px}textarea{min-height:86px;resize:vertical}button,.filebutton{background:#315f46;color:white;border:0;border-radius:7px;padding:9px 12px;font-size:13px;cursor:pointer;display:inline-block}.secondary{background:#e9efeb;color:#254531}.danger{background:#9b4b4b}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1 1 auto}.hint{font-size:12px;color:#68766c;line-height:1.6}.postedit{border:1px solid #dce4de;padding:12px;border-radius:9px;margin:12px 0;background:#fafcfb}.postedit h3{font-size:14px;margin:0}.postedit .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.postedit label{margin-top:8px}.postedit textarea{min-height:75px}.previewwrap{position:sticky;top:12px;align-self:start}.previewouter{overflow:auto;background:#dce5dc;padding:15px;border-radius:9px}.board{width:100%;min-width:280px;background:#f0f0e5;color:#242b23;font-family:'MS PGothic','Hiragino Kaku Gothic ProN','Noto Sans CJK JP',sans-serif;padding:22px 20px;line-height:1.5}.board .boardbar{font-size:12px;color:#617765;border-bottom:1px solid #a3b3a1;padding-bottom:8px}.board h1{font-size:20px;color:#23663a;line-height:1.45;margin:18px 0 22px;overflow-wrap:anywhere}.entry{margin:0 0 23px;font-size:14px;overflow-wrap:anywhere}.meta{font-size:12px;line-height:1.7}.name{color:#16822d;font-weight:bold}.op{color:#a14e26;font-weight:bold}.id{color:#555}.body{padding:6px 0 0 24px;white-space:pre-wrap;line-height:1.7}.quote{color:#277b35}.foot{font-size:11px;color:#8c988d;border-top:1px solid #b7c5b7;padding-top:10px;margin-top:20px}.toggle{display:flex;align-items:center;gap:8px;font-size:13px}.toggle input{width:auto}.notice{background:#fff9e7;border:1px solid #ebdcb0;padding:10px;border-radius:7px;font-size:12px;line-height:1.6;margin-top:12px}@media(max-width:800px){.layout{display:block;padding:10px}.panel{margin-bottom:12px}.previewwrap{position:static}.board{padding:16px 12px}.body{padding-left:12px}}@media print{.top,.editor,.actions,.previewwrap>h2,.hint,.notice{display:none!important}.layout{display:block;padding:0}.previewwrap,.panel,.previewouter{border:0;box-shadow:none;padding:0;margin:0;background:white}.board{width:100%;background:#f0f0e5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><header class="top"><h1>匿名掲示板 <small>｜中文 2ch 论坛体生成器</small></h1><small>纯本地编辑 · 无需注册 · 支持项目备份</small></header><main class="layout"><section class="panel editor"><h2>✎ 编辑帖子</h2><label>帖子标题</label><input id="title" placeholder="输入帖子标题"><label>板块名称</label><input id="section" placeholder="例如：校园闲聊区"><label>帖子日期</label><input type="date" id="date"><label class="toggle"><input type="checkbox" id="showTime" checked>显示日期、时间和匿名 ID</label><div class="row"><button id="add">＋ 添加楼层</button><button id="addOp" class="secondary">＋ 添加楼主发言</button></div><div id="editors"></div><div class="row"><button id="save" class="secondary">导出项目 JSON</button><label class="filebutton" style="margin:0;text-align:center">导入项目 JSON<input type="file" id="import" accept=".json,application/json" style="display:none"></label></div><div class="row"><button id="png">导出长图 PNG</button><button id="html" class="secondary">导出可阅读 HTML</button><button id="print" class="secondary">打印 / 存为 PDF</button></div><div class="notice">提示：PNG 导出首次需要联网加载图片组件。iPhone 若直接打开本地 HTML 后无法保存 PNG，可先使用“导出可阅读 HTML”，或在电脑浏览器打开本工具。请定期导出 JSON 备份；浏览器本地保存可能因清理缓存而丢失。</div><div class="row"><button id="reset" class="danger">清空并重新开始</button></div></section><section class="panel previewwrap"><h2>实时预览</h2><div class="previewouter"><article id="board" class="board"></article></div><p class="hint">绿色为用户名和引用，橙色为楼主。长图尺寸随内容长度自动增加。可使用 >>数字 引用其他楼层。</p></section></main><script>
const $=id=>document.getElementById(id),key='cn2ch-generator-v1';const defaults=()=>({title:'【闲聊】有人认识隔壁班那个蓝头发的吗？',section:'匿名闲聊板',date:new Date().toISOString().slice(0,10),showTime:true,posts:[{name:'匿名网友',op:true,id:'A1b2C3',time:'12:03:01',text:'如题，最近经常看到他和一个戴眼镜的男生走在一起。'},{name:'匿名网友',op:false,id:'D4e5F6',time:'12:04:18',text:'>>1\n什么情况？展开说说。'},{name:'匿名网友',op:false,id:'G7h8J9',time:'12:05:42',text:'等等，我好像知道是谁了……'}]});let state;try{state=JSON.parse(localStorage.getItem(key))||defaults();if(!Array.isArray(state.posts))throw Error()}catch(e){state=defaults()};function escapeHTML(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function randID(){return Math.random().toString(36).slice(2,8).toUpperCase()}function persist(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}function fmtText(s){return escapeHTML(s).replace(/(&gt;&gt;\d+)/g,'<span class="quote">$1</span>')}function renderBoard(){const date=state.date||'';$('board').innerHTML='<div class="boardbar">■ '+escapeHTML(state.section)+'　／　匿名掲示板</div><h1>'+escapeHTML(state.title)+'</h1>'+state.posts.map((p,i)=>'<div class="entry"><div class="meta"><b>'+(i+1)+'</b> ： <span class="'+(p.op?'op':'name')+'">'+escapeHTML(p.name||'匿名网友')+(p.op?' ◆楼主':'')+'</span>'+(state.showTime?' ： '+escapeHTML(date)+' '+escapeHTML(p.time||'12:00:00')+' <span class="id">ID:'+escapeHTML(p.id||'ANON')+'</span>':'')+'</div><div class="body">'+fmtText(p.text)+'</div></div>').join('')+'<div class="foot">匿名掲示板 · 此页面为虚构创作</div>'}function renderEditors(){const box=$('editors');box.innerHTML='';state.posts.forEach((p,i)=>{const div=document.createElement('div');div.className='postedit';div.innerHTML='<h3>第 '+(i+1)+' 楼 '+(p.op?'（楼主）':'')+'</h3><div class="grid"><div><label>用户名</label><input data-k="name" value="'+escapeHTML(p.name)+'"></div><div><label>匿名 ID</label><input data-k="id" value="'+escapeHTML(p.id)+'"></div></div><label>发言内容</label><textarea data-k="text">'+escapeHTML(p.text)+'</textarea><label class="toggle"><input type="checkbox" data-k="op" '+(p.op?'checked':'')+'>标记为楼主</label><div class="row"><button class="secondary" data-action="up">↑ 上移</button><button class="secondary" data-action="down">↓ 下移</button><button class="danger" data-action="delete">删除</button></div>';div.querySelectorAll('[data-k]').forEach(el=>el.addEventListener('input',()=>{p[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;persist();renderBoard()}));div.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;if(a==='delete'){if(!confirm('确定删除第 '+(i+1)+' 楼？'))return;state.posts.splice(i,1)}else{let j=i+(a==='up'?-1:1);if(j<0||j>=state.posts.length)return;[state.posts[i],state.posts[j]]=[state.posts[j],state.posts[i]]}refresh()});box.appendChild(div)})}function refresh(){['title','section','date'].forEach(k=>$(k).value=state[k]||'');$('showTime').checked=state.showTime;renderEditors();renderBoard();persist()}['title','section','date'].forEach(k=>$(k).addEventListener('input',e=>{state[k]=e.target.value;persist();renderBoard()}));$('showTime').onchange=e=>{state.showTime=e.target.checked;persist();renderBoard()};function add(op){state.posts.push({name:'匿名网友',op,id:op?(state.posts.find(p=>p.op)?.id||randID()):randID(),time:new Date().toTimeString().slice(0,8),text:''});refresh();setTimeout(()=>document.querySelector('.postedit:last-child textarea')?.focus(),0)}$('add').onclick=()=>add(false);$('addOp').onclick=()=>add(true);function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('save').onclick=()=>download('论坛体项目.json',JSON.stringify(state,null,2),'application/json');$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const s=JSON.parse(await f.text());if(!Array.isArray(s.posts))throw Error('缺少楼层');state=s;refresh();alert('导入成功')}catch(err){alert('导入失败：'+err.message)}e.target.value=''};$('reset').onclick=()=>{if(confirm('清空当前内容？建议先导出 JSON 备份。')){state={...defaults(),title:'',posts:[]};refresh()}};$('print').onclick=()=>window.print();$('html').onclick=()=>{const style=document.querySelector('style').outerHTML;download('论坛体阅读页.html','<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'+style+'</head><body style="margin:0;background:#f0f0e5"><article class="board" style="max-width:900px;margin:auto">'+$('board').innerHTML+'</article></body></html>','text/html')};$('png').onclick=async()=>{const btn=$('png');btn.disabled=true;btn.textContent='正在生成图片…';try{if(!window.html2canvas){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}const b=$('board');const canvas=await html2canvas(b,{backgroundColor:'#f0f0e5',scale:2,windowWidth:Math.max(800,document.documentElement.clientWidth),onclone:doc=>{const el=doc.getElementById('board');el.style.width='750px';el.style.maxWidth='none'}});canvas.toBlob(blob=>{if(!blob){alert('生成失败');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='匿名论坛长图.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}catch(e){alert('PNG 生成失败，请检查网络连接。你也可以使用截图或导出 HTML。')}finally{btn.disabled=false;btn.textContent='导出长图 PNG'}};refresh();
</script></body></html>
